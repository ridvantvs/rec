<script>
(function(){
  'use strict';
  const ACCESS_KEY='rec.private.beta.v1';
  const EXPECTED='1090169a284e00a44c0602e8c2adca382dac51739b5d7e1cdbd8fe1e51508132';
  document.body.classList.add('beta-locked');
  const gate=document.getElementById('recBetaGate');
  const input=document.getElementById('recBetaCode');
  const button=document.getElementById('recBetaEnter');
  const msg=document.getElementById('recBetaMessage');
  function unlock(){localStorage.setItem(ACCESS_KEY,'ok');document.body.classList.remove('beta-locked');gate.hidden=true;}
  async function digest(value){
    const bytes=new TextEncoder().encode(String(value||'').trim());
    const hash=await crypto.subtle.digest('SHA-256',bytes);
    return Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }
  async function check(){
    msg.textContent='';
    const value=input.value.trim();
    if(!value){msg.textContent='Erişim kodunu gir.';return;}
    button.disabled=true;
    try{
      const actual=await digest(value);
      if(actual===EXPECTED){unlock();}else{msg.textContent='Erişim kodu hatalı.';input.select();}
    }finally{button.disabled=false;}
  }
  if(localStorage.getItem(ACCESS_KEY)==='ok')unlock();
  button.addEventListener('click',check);
  input.addEventListener('keydown',e=>{if(e.key==='Enter')check();});
})();
</script>

<script>
(()=>{'use strict';
const KEY='rec.standalone.v1';
const VERSION='1.11.0';
const CLOUD_CONFIG_KEY='rec.cloud.config.v1';
const CLOUD_SESSION_KEY='rec.cloud.session.v1';
const CLOUD_STATE_KEY='rec.cloud.state.v1';
const START_MODE_KEY='rec.start.mode.v1';
let startMode=localStorage.getItem(START_MODE_KEY)||'';
function setStartMode(mode){startMode=mode;localStorage.setItem(START_MODE_KEY,mode)}
function startChoiceScreen(){return `<div class="auth-screen"><div class="auth-card" style="max-width:640px"><div class="logo">rec<span class="dot">.</span></div><h1>Nasıl kullanmak istersin?</h1><p>rec. tamamen yerel çalışabilir. Bulut bağlantısı yalnızca cihazlar arasında senkronizasyon istediğinde gerekir.</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px"><button class="panel" data-act="startLocal" style="text-align:left;color:inherit;padding:20px;cursor:pointer"><div class="eyebrow">HESAPSIZ / OFFLINE</div><h2 style="margin:8px 0 6px">Yerel Kullan</h2><p style="margin:0">Hemen başla. Veriler yalnızca bu Windows bilgisayarda tutulur.</p></button><button class="panel" data-act="startCloud" style="text-align:left;color:inherit;padding:20px;cursor:pointer;border-color:#5a2d2a"><div class="eyebrow">İSTEĞE BAĞLI</div><h2 style="margin:8px 0 6px">Buluta Bağlan</h2><p style="margin:0">Windows, Mac ve iPhone arasında aynı verileri senkronize et.</p></button></div><p class="cloud-help" style="margin-top:16px">Bu seçimi daha sonra Ayarlar bölümünden değiştirebilirsin.</p></div></div>`}

const HAD_LOCAL_DATA=!!localStorage.getItem(KEY);
const isMobile=()=>innerWidth<=950||/iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
const TYPES=['Sosyal Medya','Kurumsal Film','Fabrika Filmi','Sağlık','Etkinlik','Konser','Fuar','Ürün','Röportaj','Fotoğraf','Diğer'];
const EQCATS=['Kamera','Lens','Tripod','Gimbal','Işık','Ses','Monitör','Drone','Batarya','Hafıza Kartı','Filtre','Kablo','Aksesuar'];
const DELIVERY_STATES=['Taslak','Gönderildi','Revize Bekliyor','Revize Geldi','Onay Bekliyor','Onaylandı','Arşivlendi'];
const SHOT_STATES=['Çekilecek','Çekildi','Tekrar','Favori'];
const PROJECT_STATES=['Planlama','Çekim','Kurgu','Teslim','Tamamlandı'];
const TIMELINE_STATES=['Bekliyor','Devam Ediyor','Tamamlandı'];
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
const iso=()=>new Date().toISOString(); const dateISO=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const future=(n)=>{const d=new Date();d.setDate(d.getDate()+n);return dateISO(d)};

function jsonRead(key,fallback){try{return JSON.parse(localStorage.getItem(key)||'null')||fallback}catch{return fallback}}
let cloudConfig=jsonRead(CLOUD_CONFIG_KEY,{url:'https://vvacsqbizkkqemiqapzm.supabase.co',key:'sb_publishable_0_nkufHVSpolkcPPndBvfw__YCNMYRc'});
let cloudSession=jsonRead(CLOUD_SESSION_KEY,null);
let cloudState=jsonRead(CLOUD_STATE_KEY,{dirty:false,lastSync:'',lastServerUpdated:'',status:'local',message:'Yerel mod'});
let cloudTimer=null, cloudBusy=false;
function cleanUrl(v){return String(v||'').trim().replace(/\/+$/,'')}
function persistCloudState(){localStorage.setItem(CLOUD_STATE_KEY,JSON.stringify(cloudState))}
function setCloudStatus(status,message){cloudState.status=status;cloudState.message=message||status;persistCloudState();const el=document.querySelector('[data-cloud-status]');if(el){el.className='cloud-status '+(status==='ok'?'ok':status==='syncing'?'syncing':status==='error'?'error':'');el.innerHTML=`<i></i>${esc(message||status)}`}}
function cloudConfigured(){return !!(cleanUrl(cloudConfig.url)&&String(cloudConfig.key||'').trim())}
function sessionValid(){return !!(cloudSession?.access_token&&cloudSession?.user?.id)}
function storeSession(s){cloudSession=s||null;if(cloudSession&&cloudSession.expires_in&&!cloudSession.expires_at)cloudSession.expires_at=Math.floor(Date.now()/1000)+Number(cloudSession.expires_in);if(cloudSession)localStorage.setItem(CLOUD_SESSION_KEY,JSON.stringify(cloudSession));else localStorage.removeItem(CLOUD_SESSION_KEY)}
function cloudLabel(){if(!navigator.onLine)return 'Offline · değişiklikler cihazda';if(cloudBusy)return 'Senkronize ediliyor…';if(!cloudConfigured())return 'Yerel mod';if(!sessionValid())return 'Bulut · giriş gerekli';if(cloudState.dirty)return 'Bulut · değişiklik bekliyor';if(cloudState.lastSync)return 'Bulut · senkronize';return 'Bulut · hazır'}
async function authRequest(path,body){if(!cloudConfigured())throw new Error('Önce Supabase URL ve publishable key gir.');const r=await fetch(cleanUrl(cloudConfig.url)+path,{method:'POST',headers:{'apikey':cloudConfig.key,'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.msg||j.error_description||j.message||`HTTP ${r.status}`);return j}
async function refreshSession(){if(!cloudSession?.refresh_token||!cloudConfigured())return null;try{const j=await authRequest('/auth/v1/token?grant_type=refresh_token',{refresh_token:cloudSession.refresh_token});storeSession(j);return cloudSession}catch(e){storeSession(null);throw e}}
async function ensureSession(){if(!sessionValid())return null;const exp=Number(cloudSession.expires_at||0);if(exp&&exp<Math.floor(Date.now()/1000)+90)await refreshSession();return cloudSession}
async function dbRequest(path,opt={}){const ses=await ensureSession();if(!ses)throw new Error('Bulut hesabına giriş yap.');const headers={'apikey':cloudConfig.key,'Authorization':`Bearer ${ses.access_token}`,'Content-Type':'application/json',...(opt.headers||{})};let r=await fetch(cleanUrl(cloudConfig.url)+path,{...opt,headers});if(r.status===401&&cloudSession?.refresh_token){await refreshSession();headers.Authorization=`Bearer ${cloudSession.access_token}`;r=await fetch(cleanUrl(cloudConfig.url)+path,{...opt,headers})}const text=await r.text();let j=null;try{j=text?JSON.parse(text):null}catch{j=text}if(!r.ok)throw new Error(j?.message||j?.hint||j?.details||String(j||`HTTP ${r.status}`));return j}
async function cloudSignUp(){const email=document.getElementById('cloudEmail')?.value.trim();const password=document.getElementById('cloudPassword')?.value||'';if(!email||password.length<6)return toast('E-posta ve en az 6 karakter parola gerekli.');try{setCloudStatus('syncing','Hesap oluşturuluyor…');const j=await authRequest('/auth/v1/signup',{email,password});if(j.access_token){storeSession(j);toast('Hesap oluşturuldu ve giriş yapıldı.');await syncNow(true)}else{toast('Hesap oluşturuldu. E-posta doğrulaması açıksa gelen kutunu kontrol et.');setCloudStatus('local','E-posta doğrulaması bekleniyor')}}catch(e){setCloudStatus('error',e.message);toast(e.message)}render()}
async function cloudSignIn(){const email=document.getElementById('cloudEmail')?.value.trim();const password=document.getElementById('cloudPassword')?.value||'';if(!email||!password)return toast('E-posta ve parola gerekli.');try{setCloudStatus('syncing','Giriş yapılıyor…');const j=await authRequest('/auth/v1/token?grant_type=password',{email,password});storeSession(j);cloudState.lastServerUpdated='';persistCloudState();toast('Bulut hesabına giriş yapıldı.');await syncNow(true)}catch(e){setCloudStatus('error',e.message);toast(e.message)}render()}
function cloudSignOut(){storeSession(null);cloudState={dirty:false,lastSync:'',lastServerUpdated:'',status:'local',message:'Yerel mod'};persistCloudState();render();toast('Bulut hesabından çıkıldı. Yerel veriler korunuyor.')}
function saveCloudConfig(){const u=cleanUrl(document.getElementById('cloudUrl')?.value);const k=document.getElementById('cloudKey')?.value.trim();if(!/^https:\/\//.test(u)||!k)return toast('Geçerli HTTPS Supabase URL ve publishable key gerekli.');const changed=u!==cloudConfig.url||k!==cloudConfig.key;cloudConfig={url:u,key:k};localStorage.setItem(CLOUD_CONFIG_KEY,JSON.stringify(cloudConfig));if(changed)storeSession(null);setCloudStatus('local','Bulut yapılandırması kaydedildi');render();toast(changed?'Bulut ayarları kaydedildi. Şimdi giriş yap.':'Bulut ayarları güncel.')}
async function fetchServerState(){const uid=cloudSession?.user?.id;if(!uid)return null;const rows=await dbRequest(`/rest/v1/workspace_state?select=payload,updated_at&user_id=eq.${encodeURIComponent(uid)}&limit=1`,{method:'GET'});return Array.isArray(rows)?rows[0]||null:null}
async function pushCloudState(){if(!navigator.onLine||!cloudConfigured()||!sessionValid())return false;cloudBusy=true;setCloudStatus('syncing','Senkronize ediliyor…');try{const uid=cloudSession.user.id;const rows=await dbRequest('/rest/v1/workspace_state?on_conflict=user_id',{method:'POST',headers:{'Prefer':'resolution=merge-duplicates,return=representation'},body:JSON.stringify({user_id:uid,payload:data})});const row=Array.isArray(rows)?rows[0]:null;cloudState.dirty=false;cloudState.lastSync=iso();cloudState.lastServerUpdated=row?.updated_at||cloudState.lastSync;cloudState.status='ok';cloudState.message='Senkronize edildi';persistCloudState();setCloudStatus('ok','Bulut · senkronize');return true}catch(e){cloudState.status='error';cloudState.message=e.message;persistCloudState();setCloudStatus('error','Senkronizasyon hatası');console.error(e);return false}finally{cloudBusy=false}}
async function pullCloudState(row){if(!row?.payload)return false;data=row.payload;migrate();localStorage.setItem(KEY,JSON.stringify(data));cloudState.dirty=false;cloudState.lastSync=iso();cloudState.lastServerUpdated=row.updated_at||cloudState.lastSync;cloudState.status='ok';cloudState.message='Senkronize edildi';persistCloudState();if(!data.projects.some(p=>p.id===ui.activeProjectId))ui.activeProjectId=data.projects[0]?.id||'';return true}
async function syncNow(force=false){if(cloudBusy||!navigator.onLine||!cloudConfigured()||!sessionValid())return false;cloudBusy=true;setCloudStatus('syncing','Senkronize ediliyor…');try{const row=await fetchServerState();if(!row){cloudBusy=false;return await pushCloudState()}const localTs=Date.parse(data.meta?.updatedAt||0)||0;const remoteTs=Date.parse(row.payload?.meta?.updatedAt||row.updated_at||0)||0;if(!cloudState.lastSync&&HAD_LOCAL_DATA&&localTs>remoteTs){cloudBusy=false;return await pushCloudState()}if(remoteTs>localTs){await pullCloudState(row);setCloudStatus('ok','Bulut · senkronize');requestSafeRender();return true}if(cloudState.dirty||localTs>remoteTs){cloudBusy=false;return await pushCloudState()}cloudState.lastSync=iso();cloudState.lastServerUpdated=row.updated_at||cloudState.lastServerUpdated;cloudState.status='ok';cloudState.message='Senkronize edildi';persistCloudState();setCloudStatus('ok','Bulut · senkronize');return true}catch(e){cloudState.status='error';cloudState.message=e.message;persistCloudState();setCloudStatus('error','Senkronizasyon hatası');console.error(e);if(force)toast(e.message);return false}finally{cloudBusy=false}}
function scheduleCloudSync(){if(cloudTimer)clearTimeout(cloudTimer);if(navigator.onLine&&cloudConfigured()&&sessionValid())cloudTimer=setTimeout(()=>syncNow(false),700)}
async function compressImage(file,maxSide=1400,quality=.72){return new Promise((resolve,reject)=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{try{let w=img.width,h=img.height;const scale=Math.min(1,maxSide/Math.max(w,h));w=Math.round(w*scale);h=Math.round(h*scale);const c=document.createElement('canvas');c.width=w;c.height=h;const ctx=c.getContext('2d');ctx.drawImage(img,0,0,w,h);const result=c.toDataURL('image/jpeg',quality);URL.revokeObjectURL(url);resolve(result)}catch(e){URL.revokeObjectURL(url);reject(e)}};img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('Görsel okunamadı.'))};img.src=url})}

function seed(){return{version:VERSION,meta:{updatedAt:iso()},settings:{name:'',accent:'#ff3b30'},projects:[],shots:[],equipment:[],deliveries:[],timeline:[],notes:[],gearChecks:{},gearLists:{},calendarEvents:[],trash:[],editVersions:{},projectNotes:{},activity:[]}}
let data;try{data=JSON.parse(localStorage.getItem(KEY)||'null')||seed()}catch{data=seed()}
function migrate(){data.version=VERSION;if(!data.meta){const all=[...(data.projects||[]),...(data.shots||[]),...(data.equipment||[]),...(data.deliveries||[]),...(data.timeline||[]),...(data.notes||[])];const latest=all.map(x=>x.updatedAt||x.createdAt).filter(Boolean).sort().pop();data.meta={updatedAt:latest||iso()}};data.settings=data.settings||{name:''};data.projects=data.projects||[];data.shots=data.shots||[];data.equipment=data.equipment||[];data.deliveries=data.deliveries||[];data.timeline=data.timeline||[];data.notes=data.notes||[];data.gearChecks=data.gearChecks||{};data.gearLists=data.gearLists||{};}
migrate();

function save(markDirty=true){data.meta=data.meta||{};if(markDirty){data.meta.updatedAt=iso();cloudState.dirty=true;persistCloudState()}localStorage.setItem(KEY,JSON.stringify(data));if(markDirty)scheduleCloudSync()}
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const fmtDate=s=>{if(!s)return'—';try{return new Intl.DateTimeFormat('tr-TR',{day:'2-digit',month:'short'}).format(new Date(s+'T12:00:00'))}catch{return s}};
const project=()=>data.projects.find(p=>p.id===ui.activeProjectId&&!p.archivedAt)||data.projects.find(p=>!p.archivedAt&&p.status!=='Tamamlandı')||data.projects.find(p=>!p.archivedAt);
const shots=()=>data.shots.filter(x=>x.projectId===project()?.id).sort((a,b)=>a.no-b.no);
const tl=()=>data.timeline.filter(x=>x.projectId===project()?.id).sort((a,b)=>a.sortOrder-b.sortOrder||a.time.localeCompare(b.time));
const deliveries=()=>data.deliveries.filter(x=>x.projectId===project()?.id).sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}

function sectionTitle(k,t,a=''){return `<div class="section-title"><div>${k?`<div class="eyebrow">${esc(k)}</div>`:''}<h2>${esc(t)}</h2></div><div class="actions">${a}</div></div>`}
function shell(body){const mobile=isMobile();const desktopNav=[['home','Ana Sayfa'],['projects','Projeler'],['shoot','Çekim'],['shots','Shot List'],['equipment','Ekipman'],['deliveries','Teslimler']];const mobileNav=[['home','Bugün'],['shoot','Çekim'],['shots','Shots'],['equipment','Ekipman'],['projects','Projeler']];const p=project();return `<div class="app"><aside class="sidebar"><div class="logo">rec<span class="dot">.</span></div><div class="nav">${desktopNav.map(([v,l])=>`<button class="${ui.view===v?'active':''}" data-view="${v}">${l}</button>`).join('')}</div><div class="sidefoot"><button data-act="palette">⌘K · Ara / Komut</button><div data-cloud-status class="cloud-status"><i></i>${esc(cloudLabel())}</div><button data-view="settings">Ayarlar / Yedek</button></div></aside><main class="main"><header class="topbar"><div class="mobile-only"><div class="logo small">rec<span class="dot">.</span></div></div><div class="desktop-project-switch"><span class="eyebrow">AKTİF PROJE &nbsp;</span><select id="projectSwitch">${data.projects.map(x=>`<option value="${x.id}" ${x.id===p?.id?'selected':''}>${esc(x.client)} — ${esc(x.name)}</option>`).join('')}</select></div><div class="mobile-project-switch hidden"><select id="projectSwitchMobile">${data.projects.map(x=>`<option value="${x.id}" ${x.id===p?.id?'selected':''}>${esc(x.client)} — ${esc(x.name)}</option>`).join('')}</select></div><div data-cloud-status class="cloud-status"><i></i>${esc(cloudLabel())}</div></header><div class="content">${body}</div></main><nav class="bottom-nav">${mobileNav.map(([v,l])=>`<button class="${ui.view===v?'active':''}" data-view="${v}">${l}</button>`).join('')}</nav></div>${ui.palette?palette():''}${ui.modal?modal():''}`}
function dashboard(){const today=dateISO();const todayP=data.projects.filter(p=>p.shootDate===today);const upcoming=[...data.projects].filter(p=>p.deliveryDate>=today).sort((a,b)=>a.deliveryDate.localeCompare(b.deliveryDate)).slice(0,4);const active=data.projects.filter(p=>p.status!=='Teslim').slice(0,6);const day=new Intl.DateTimeFormat('tr-TR',{day:'numeric',month:'long',year:'numeric',weekday:'long'}).format(new Date());return `<div class="hero"><div class="eyebrow">${esc(day.toLocaleUpperCase('tr-TR'))}</div><h1>Günaydın ${esc(data.settings.name||'Kullanıcı')}</h1><p>Çekim, ekipman ve teslim akışın tek yerde.</p></div><div class="grid two"><section class="panel">${sectionTitle('BUGÜN','Çekim Akışı',btn('+ Çekim Planla','newProject','btn small'))}${todayP.length?todayP.map(p=>`<div class="row"><div><b>${esc(p.client)}</b><small>${esc(p.name)} · ${esc(p.location)}</small></div><button class="btn small" data-open-project="${p.id}" data-target="shoot">Aç</button></div>`).join(''):`<div class="empty">Bugün planlanmış çekim yok.</div>`}</section><section class="panel">${sectionTitle('YAKLAŞAN','Teslimler',btn('+ Teslim','newDelivery','btn small'))}${upcoming.length?upcoming.map(p=>`<div class="row"><div><b>${esc(p.client)} — ${esc(p.name)}</b><small>${fmtDate(p.deliveryDate)} · ${esc(p.status)}</small></div><span class="pill ${p.deliveryDate===today?'red':''}">${fmtDate(p.deliveryDate)}</span></div>`).join(''):`<div class="empty">Yaklaşan teslim yok.</div>`}</section></div><div style="height:15px"></div><section class="panel">${sectionTitle('DEVAM EDEN','Projeler',btn('+ Yeni Proje','newProject','btn primary small'))}<div class="project-grid">${active.map(p=>projectCard(p)).join('')||'<div class="empty">Henüz proje yok.</div>'}</div></section><div style="height:15px"></div><section class="panel">${sectionTitle('HIZLI ERİŞİM','Araçlar')}<div class="actions">${btn('Kurgu Takibi','goShoot')}${btn('Shot List','goShots')}${btn('Gear Check','goEquipment')}${btn('Teslim Ekle','newDelivery')}</div></section>`}
function projectCard(p){return `<article class="card project-card ${p.id===ui.activeProjectId?'selected':''}" data-open-project="${p.id}" data-target="projects"><div class="eyebrow">${esc(p.type)}</div><h3>${esc(p.client)}</h3><p>${esc(p.name)}</p><div class="status"><span>${esc(p.status)}</span><span>${fmtDate(p.shootDate)} → ${fmtDate(p.deliveryDate)}</span></div></article>`}
function projectsView(){return `<section>${sectionTitle('PROJELER','Tüm Projeler',btn('+ Yeni Proje','newProject','btn primary'))}<div class="project-grid">${data.projects.map(projectCard).join('')||'<div class="empty">İlk projenizi oluşturun.</div>'}</div></section>`}
function shootView(){const p=project();if(!p)return emptyProject();const list=tl();const current=list.find(x=>x.status==='Devam Ediyor')||list.find(x=>x.status==='Bekliyor');const s=shots();const done=s.filter(x=>x.status==='Çekildi'||x.status==='Favori').length;const pct=s.length?Math.round(done/s.length*100):0;return `<div class="hero"><div class="eyebrow">ÇEKİM GÜNÜ · ${fmtDate(p.shootDate)}</div><h1>${esc(p.client)} — ${esc(p.name)}</h1><p>${esc(p.location)} · ${esc(p.team.join(', '))}</p></div><div class="mobile-shoot"><section class="panel big-task"><div class="eyebrow">ŞİMDİ</div><h2>${esc(current?.title||'Plan tamamlandı')}</h2><p>${current?`${esc(current.time)} · sıradaki göreve hazır ol.`:'Bugünkü timeline tamamlandı.'}</p><div class="actions">${current?btn('Tamamlandı','completeCurrent','btn primary'):''}${btn('Not Ekle','focusNote')}${btn('Sonraki Shot','nextShot')}</div></section><section class="panel"><div class="eyebrow">SHOT İLERLEMESİ</div><div class="kpi">${pct}%</div><div class="progress"><i style="width:${pct}%"></i></div><div class="kpi-label">${done}/${s.length} çekildi</div></section><section class="panel"><div class="eyebrow">GEAR CHECK</div>${gearReadyHtml(p.id,true)}</section></div><div style="height:15px"></div><section class="panel">${sectionTitle('GÜN AKIŞI','Timeline',btn('+ Görev','newTimeline','btn small'))}<div class="timeline">${list.map(x=>`<div class="timeline-item ${x.status==='Tamamlandı'?'done':x.status==='Devam Ediyor'?'current':''}"><div class="time">${esc(x.time)}</div><div class="node"></div><div><h4>${esc(x.title)}</h4><small>${esc(x.status)}</small></div><div class="actions"><button class="btn small" data-cycle-timeline="${x.id}">Durum</button><button class="btn small ghost" data-edit-timeline="${x.id}">Düzenle</button></div></div>`).join('')||'<div class="empty">Timeline boş.</div>'}</div><div class="quicknote"><textarea id="quickNote" placeholder="Hızlı not… Örn. Shot 12’de focus kaçtı."></textarea><button class="btn primary" data-act="addNote">Not Ekle</button></div><div class="notes">${data.notes.filter(n=>n.projectId===p.id).sort((a,b)=>b.createdAt.localeCompare(a.createdAt)).slice(0,12).map(n=>`<div class="note"><small>${new Date(n.createdAt).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'})}</small><div>${esc(n.body)}</div><button class="btn small ghost" data-delete-note="${n.id}">×</button></div>`).join('')}</div></section>`}
function shotsView(){const p=project();if(!p)return emptyProject();const s=shots();const controls=`<div class="segmented"><button data-shot-view="list" class="${ui.shotView==='list'?'active':''}">Liste</button><button data-shot-view="card" class="${ui.shotView==='card'?'active':''}">Kart</button><button data-shot-view="story" class="${ui.shotView==='story'?'active':''}">Storyboard</button></div>${btn('Akıllı Oluştur','smartShots','btn')}${btn('+ Shot','newShot','btn primary')}`;let body='';if(ui.shotView==='list')body=`<div class="table-wrap"><table><thead><tr><th>SHOT</th><th>AD</th><th>KAMERA</th><th>LENS</th><th>FPS</th><th>KADRAJ</th><th>HAREKET</th><th>DURUM</th></tr></thead><tbody>${s.map(x=>`<tr class="clickable" data-edit-shot="${x.id}"><td>${String(x.no).padStart(3,'0')}</td><td><b>${esc(x.name)}</b><br><span class="muted">${esc(x.description)}</span></td><td>${esc(x.camera)}</td><td>${esc(x.lens)}</td><td>${esc(x.fps)}</td><td>${esc(x.framing)}</td><td>${esc(x.movement)}</td><td><span class="pill ${x.status==='Tekrar'?'red':x.status==='Çekildi'?'good':''}">${esc(x.status)}</span></td></tr>`).join('')}</tbody></table></div>`;else if(ui.shotView==='card')body=`<div class="shot-grid">${s.map(x=>`<article class="card shot-card" data-edit-shot="${x.id}"><div><span class="eyebrow">SHOT ${String(x.no).padStart(3,'0')}</span><span class="pill ${x.status==='Tekrar'?'red':x.status==='Çekildi'?'good':''}">${esc(x.status)}</span></div><h3>${esc(x.name)}</h3><p>${esc(x.description)}</p><dl class="meta"><dt>Lens</dt><dd>${esc(x.lens)}</dd><dt>FPS</dt><dd>${esc(x.fps)}</dd><dt>Hareket</dt><dd>${esc(x.movement)}</dd><dt>Destek</dt><dd>${esc(x.support)}</dd></dl></article>`).join('')}</div>`;else body=`<div class="story-grid">${s.map(x=>`<article class="card story-card"><label class="story-image">${x.storyboardImage?`<img src="${x.storyboardImage}" alt="">`:'<span>Referans görsel ekle</span>'}<input type="file" accept="image/*" data-story-image="${x.id}"></label><div class="story-info" data-edit-shot="${x.id}"><div class="eyebrow">SHOT ${String(x.no).padStart(3,'0')}</div><h3>${esc(x.name)}</h3><div class="muted small">${esc(x.lens)} · ${esc(x.framing)} · ${esc(x.movement)}</div></div></article>`).join('')}</div>`;return `${sectionTitle('SHOT LIST',p.name,controls)}${s.length?body:`<div class="panel empty">İlk shot’ını oluştur.<br><br>${btn('+ Shot Ekle','newShot')}${btn('Akıllı Shot List Oluştur','smartShots')}</div>`}`}
function equipmentView(){const p=project();if(!p)return emptyProject();return `<div class="grid two"><section class="panel">${sectionTitle('EKİPMAN','Envanter',btn('+ Ekipman','newEquipment','btn primary small'))}<div class="table-wrap"><table><thead><tr><th>EKİPMAN</th><th>KATEGORİ</th><th>ADET</th><th>DURUM</th><th>NOT</th></tr></thead><tbody>${data.equipment.map(e=>`<tr class="clickable" data-edit-equipment="${e.id}"><td><b>${esc(e.name)}</b></td><td>${esc(e.category)}</td><td>${e.quantity}</td><td><span class="pill ${e.status==='Hazır'?'good':e.status==='Eksik'?'red':''}">${esc(e.status)}</span></td><td>${esc(e.note||'')}</td></tr>`).join('')}</tbody></table></div></section><section class="panel">${sectionTitle('PROJE','Gear Check',`${btn('Tümünü Ekle','gearAll','btn small')}${btn('Temizle','gearClear','btn small ghost')}`)}${gearReadyHtml(p.id)}<div class="checklist">${gearList(p.id).map(e=>`<label class="check"><input type="checkbox" data-gear-check="${e.id}" ${gearChecked(p.id,e.id)?'checked':''}><span><b>${esc(e.name)}</b><br><small class="muted">${esc(e.category)} · ${e.quantity} adet</small></span></label>`).join('')||'<div class="empty">Bu projeye ekipman eklenmedi. “Tümünü Ekle” ile başlayabilirsin.</div>'}</div><div style="height:18px"></div>${sectionTitle('FİNAL KONTROL','Çekime Hazır Checklist')}<div class="checklist">${['Bataryalar dolu mu?','Kartlar hazır mı?','Lensler temiz mi?','Ses testi yapıldı mı?','Mikrofon pili kontrol edildi mi?','Tripod plate var mı?','ND filtre var mı?','Powerbank var mı?','SSD var mı?','Adres kontrol edildi mi?'].map((x,i)=>`<label class="check"><input type="checkbox" data-final-check="${i}" ${finalChecked(p.id,i)?'checked':''}><span>${x}</span></label>`).join('')}</div></section></div>`}
function gearList(pid){const ids=data.gearLists[pid]||[];return ids.map(id=>data.equipment.find(e=>e.id===id)).filter(Boolean)}function gearChecked(pid,id){return (data.gearChecks[pid]||[]).includes('gear:'+id)}function finalChecked(pid,i){return (data.gearChecks[pid]||[]).includes('final:'+i)}function gearReadyHtml(pid,compact=false){const gl=gearList(pid);const gc=gl.filter(e=>gearChecked(pid,e.id)).length;const finals=Array.from({length:10},(_,i)=>finalChecked(pid,i)).filter(Boolean).length;const ready=gl.length>0&&gc===gl.length&&finals===10;return `<div class="ready ${ready?'good':''}">${ready?'ÇEKİME HAZIR':'HAZIR DEĞİL'}</div>${compact?`<div class="muted small">Gear ${gc}/${gl.length} · Final ${finals}/10</div>`:`<div class="muted small" style="margin-bottom:14px">Gear ${gc}/${gl.length} · Final kontrol ${finals}/10</div>`}`}
function deliveriesView(){const p=project();if(!p)return emptyProject();const ds=deliveries();return `<section>${sectionTitle('MÜŞTERİ TESLİM','Versiyonlar',btn('+ Teslim Ekle','newDelivery','btn primary'))}<div class="delivery-list">${ds.map(d=>`<article class="delivery"><div><h3>${esc(d.version)}</h3><span class="pill ${d.status==='Onaylandı'?'good':d.status.includes('Revize')?'red':''}">${esc(d.status)}</span></div><div><b>${esc(d.fileName)}</b><p>${fmtDate(d.date)} ${esc(d.time||'')} · ${esc(d.note||'')}</p>${d.link?`<p><a href="${esc(d.link)}" target="_blank" rel="noreferrer">Teslim linkini aç ↗</a></p>`:''}</div><div class="actions"><button class="btn small" data-edit-delivery="${d.id}">Düzenle</button></div></article>`).join('')||'<div class="panel empty">Henüz teslim kaydı yok.</div>'}</div></section>`}
function settingsView(){const size=new Blob([JSON.stringify(data)]).size;const email=cloudSession?.user?.email||'';return `<div class="grid two"><section class="panel">${sectionTitle('BULUT SENKRONİZASYONU','Windows ↔ iPhone')}<div data-cloud-status class="cloud-status ${cloudState.status==='ok'?'ok':cloudState.status==='syncing'?'syncing':cloudState.status==='error'?'error':''}"><i></i>${esc(cloudLabel())}</div><div style="height:14px"></div><div class="form-grid"><div class="field full"><label>Supabase Project URL</label><input id="cloudUrl" placeholder="https://xxxx.supabase.co" value="${esc(cloudConfig.url||'')}"></div><div class="field full"><label>Publishable / anon key</label><input id="cloudKey" type="password" placeholder="sb_publishable_..." value="${esc(cloudConfig.key||'')}"></div></div><div class="actions" style="margin-top:12px">${btn('Bulut Ayarını Kaydet','cloudSaveConfig','btn')}</div><div style="height:18px;border-bottom:1px solid var(--line)"></div>${email?`<div class="row"><div><b>Giriş yapılan hesap</b><small>${esc(email)}</small></div><span class="pill good">Bağlı</span></div><div class="actions">${btn('Şimdi Senkronize Et','cloudSync','btn primary')}${btn('Çıkış Yap','cloudSignOut','btn')}</div>`:`<div class="form-grid" style="margin-top:17px"><div class="field full"><label>E-posta</label><input id="cloudEmail" type="email" autocomplete="email" placeholder="mail@example.com"></div><div class="field full"><label>Parola</label><input id="cloudPassword" type="password" autocomplete="current-password" placeholder="En az 6 karakter"></div></div><div class="actions" style="margin-top:12px">${btn('Giriş Yap','cloudSignIn','btn primary')}${btn('Hesap Oluştur','cloudSignUp','btn')}</div>`}<p class="cloud-help">Aynı Supabase projesi ve aynı rec. hesabıyla Mac ve iPhone’da giriş yaptığında veriler otomatik eşitlenir. İnternet yokken değişiklikler bu cihazda kalır ve bağlantı geri geldiğinde gönderilir.</p></section><section class="panel">${sectionTitle('IPHONE','Ana Ekrana Kur')}<div class="install-card"><b>1.</b> rec.’in HTTPS adresini iPhone’da Safari ile aç.<br><br><b>2.</b> Paylaş → <b>Ana Ekrana Ekle</b>.<br><br><b>3.</b> <b>Web Uygulaması Olarak Aç</b> seçeneğini açık bırak ve Ekle.<br><br><b>4.</b> rec. ikonundan açıp Ayarlar’dan aynı bulut hesabına giriş yap.</div><p class="cloud-help">Bu PWA, iPhone ana ekranında ayrı uygulama penceresinde çalışır. </p></section><section class="panel">${sectionTitle('AYARLAR','Yerel Veri')}<div class="row"><div><b>Uygulama</b><small>rec. Windows Desktop v${VERSION}</small></div></div><div class="row"><div><b>Yerel kayıt</b><small>Offline kullanım için bu cihazda tutulur</small></div><span class="pill good">Offline-ready</span></div><div class="row"><div><b>Veri boyutu</b><small>${Math.round(size/1024)} KB</small></div></div><div class="actions" style="margin-top:14px">${btn('Yedek İndir','exportData','btn primary')}${btn('Yedek Yükle','importData')}${btn('Yerel Veriyi Sıfırla','resetData','btn danger')}</div><input id="importFile" class="hidden" type="file" accept="application/json"></section><section class="panel">${sectionTitle('HAKKINDA','rec.')}<div class="logo">rec<span class="dot">.</span></div><p class="muted">by kalfmedia.</p><p class="muted">Az tık. Az karmaşa. Hızlı kullanım.</p><div style="height:15px"></div><div class="eyebrow">SENKRONİZASYON</div><p class="muted small">Bulut yapılandırılmadığında rec. tamamen yerel çalışır. Bulut yapılandırıldığında kullanıcıya ait workspace, Supabase Auth + Row Level Security üzerinden senkronize edilir.</p></section></div>`}
function emptyProject(){return `<div class="panel empty">Henüz proje yok. ${btn('İlk Projeni Oluştur','newProject')}</div>`}
function palette(){const q=ui.search.toLocaleLowerCase('tr-TR');const base=[{l:'Yeni Proje',s:'Komut',a:'newProject'},{l:'Çekim Planla',s:'Komut',a:'goShoot'},{l:'Shot Ekle',s:'Komut',a:'newShot'},{l:'Gear Check',s:'Komut',a:'goEquipment'},{l:'Teslim Ekle',s:'Komut',a:'newDelivery'}];const projects=data.projects.map(p=>({l:`${p.client} — ${p.name}`,s:'Proje',pid:p.id,a:'openProject'}));const shotResults=data.shots.map(s=>({l:`Shot ${String(s.no).padStart(3,'0')} — ${s.name}`,s:'Shot',pid:s.projectId,a:'openShot',sid:s.id}));const rs=[...base,...projects,...shotResults].filter(x=>!q||x.l.toLocaleLowerCase('tr-TR').includes(q)).slice(0,20);return `<div class="palette-backdrop" data-act="closePalette"><div class="palette" onclick="event.stopPropagation()"><input id="paletteSearch" autofocus placeholder="Proje, shot veya komut ara…" value="${esc(ui.search)}"><div class="palette-results">${rs.map((r,i)=>`<button data-palette-action="${r.a}" ${r.pid?`data-pid="${r.pid}"`:''} ${r.sid?`data-sid="${r.sid}"`:''}><span>${esc(r.l)}</span><small>${esc(r.s)}</small></button>`).join('')||'<div class="empty">Sonuç yok.</div>'}</div></div></div>`}
function modal(){const m=ui.modal;if(m.type==='project')return projectModal(m.id);if(m.type==='shot')return shotModal(m.id);if(m.type==='equipment')return equipmentModal(m.id);if(m.type==='delivery')return deliveryModal(m.id);if(m.type==='timeline')return timelineModal(m.id);if(m.type==='smart')return smartModal();return ''}
function modalWrap(title,body,actions){return `<div class="modal-backdrop" data-act="closeModal"><div class="modal" onclick="event.stopPropagation()"><div class="modal-head"><h3>${esc(title)}</h3><button data-act="closeModal">×</button></div><div class="modal-body">${body}<div class="modal-actions">${actions}</div></div></div></div>`}
function field(name,label,value='',type='text',opts=[]){if(type==='select')return `<div class="field"><label>${esc(label)}</label><select name="${name}">${opts.map(o=>`<option ${o===value?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`;if(type==='textarea')return `<div class="field full"><label>${esc(label)}</label><textarea name="${name}">${esc(value)}</textarea></div>`;return `<div class="field"><label>${esc(label)}</label><input name="${name}" type="${type}" value="${esc(value)}"></div>`}
function projectModal(id){const x=data.projects.find(p=>p.id===id)||{id:'',client:'',name:'',type:'Sosyal Medya',shootDate:dateISO(),deliveryDate:future(3),location:'',format:'9:16',team:[data.settings.name||'Kullanıcı'],notes:'',status:'Planlama',nextTask:'',updatedAt:iso()};const b=`<form id="modalForm"><div class="form-grid">${field('client','Müşteri',x.client)}${field('name','Proje adı',x.name)}${field('type','Proje türü',x.type,'select',TYPES)}${field('status','Durum',x.status,'select',PROJECT_STATES)}${field('shootDate','Çekim tarihi',x.shootDate,'date')}${field('deliveryDate','Teslim tarihi',x.deliveryDate,'date')}${field('location','Lokasyon',x.location)}${field('format','Format',x.format,'select',['9:16','16:9','4:5','1:1','Diğer'])}${field('team','Ekip',x.team.join(', '))}${field('nextTask','Sonraki görev',x.nextTask)}${field('notes','Not',x.notes||'','textarea')}</div></form>`;const a=`${id?`<button class="btn danger" data-delete-project="${id}">Çöp Kutusuna Taşı</button>`:''}<span class="spacer"></span><button class="btn" data-act="closeModal">Vazgeç</button><button class="btn primary" data-save-project="${id||''}">Kaydet</button>`;return modalWrap(id?'Projeyi Düzenle':'Yeni Proje',b,a)}
function shotModal(id){const p=project();const next=Math.max(0,...data.shots.filter(s=>s.projectId===p.id).map(s=>s.no))+1;const x=data.shots.find(s=>s.id===id)||{id:'',projectId:p.id,no:next,name:'',description:'',camera:'Sony FX30',lens:'24-70mm',fps:50,shutter:'1/100',framing:'Medium',movement:'Static',support:'Tripod',location:'',subject:'',estimatedMinutes:5,note:'',status:'Çekilecek',storyboardImage:'',updatedAt:iso()};const b=`<form id="modalForm"><div class="form-grid">${field('no','Shot No',x.no,'number')}${field('name','Shot adı',x.name)}${field('camera','Kamera',x.camera)}${field('lens','Lens',x.lens)}${field('fps','FPS',x.fps,'number')}${field('shutter','Shutter',x.shutter)}${field('framing','Kadraj',x.framing)}${field('movement','Kamera hareketi',x.movement)}${field('support','Destek sistemi',x.support)}${field('location','Lokasyon',x.location)}${field('subject','Kişi / ürün',x.subject)}${field('estimatedMinutes','Tahmini süre (dk)',x.estimatedMinutes,'number')}${field('status','Durum',x.status,'select',SHOT_STATES)}${field('description','Açıklama',x.description,'textarea')}${field('note','Not',x.note||'','textarea')}</div></form>`;const a=`${id?`<button class="btn danger" data-delete-shot="${id}">Çöp Kutusuna Taşı</button>`:''}<span class="spacer"></span><button class="btn" data-act="closeModal">Vazgeç</button><button class="btn primary" data-save-shot="${id||''}">Kaydet</button>`;return modalWrap(id?'Shot Düzenle':'Yeni Shot',b,a)}

.shots.find(x=>x.id===inp.dataset.storyImage);sh.storyboardImage=img;sh.updatedAt=iso();save();render()}catch(err){toast(err.message||'Görsel işlenemedi.')}});document.querySelectorAll('[data-act]').forEach(b=>b.onclick=(e)=>{e.stopPropagation();action(b.dataset.act)});document.querySelectorAll('[data-save-project]').forEach(b=>b.onclick=()=>saveProject(b.dataset.saveProject));document.querySelectorAll('[data-delete-project]').forEach(b=>b.onclick=()=>deleteProject(b.dataset.deleteProject));document.querySelectorAll('[data-save-shot]').forEach(b=>b.onclick=()=>saveShot(b.dataset.saveShot));document.querySelectorAll('[data-delete-shot]').forEach(b=>b.onclick=()=>delEntity('shots',b.dataset.deleteShot));document.querySelectorAll('[data-save-equipment]').forEach(b=>b.onclick=()=>saveEquipment(b.dataset.saveEquipment));document.querySelectorAll('[data-delete-equipment]').forEach(b=>b.onclick=()=>delEntity('equipment',b.dataset.deleteEquipment));document.querySelectorAll('[data-save-delivery]').forEach(b=>b.onclick=()=>saveDelivery(b.dataset.saveDelivery));document.querySelectorAll('[data-delete-delivery]').forEach(b=>b.onclick=()=>delEntity('deliveries',b.dataset.deleteDelivery));document.querySelectorAll('[data-save-timeline]').forEach(b=>b.onclick=()=>saveTimeline(b.dataset.saveTimeline));document.querySelectorAll('[data-delete-timeline]').forEach(b=>b.onclick=()=>delEntity('timeline',b.dataset.deleteTimeline));document.querySelectorAll('[data-delete-note]').forEach(b=>b.onclick=()=>delEntity('notes',b.dataset.deleteNote));const pq=document.getElementById('paletteSearch');if(pq)pq.oninput=e=>{ui.search=e.target.value;render()};document.querySelectorAll('[data-palette-action]').forEach(b=>b.onclick=()=>paletteAction(b));const imp=document.getElementById('importFile');if(imp)imp.onchange=importFile}
function toggleCheck(pid,key,on){data.gearChecks[pid]=data.gearChecks[pid]||[];const a=data.gearChecks[pid];if(on&&!a.includes(key))a.push(key);if(!on)data.gearChecks[pid]=a.filter(x=>x!==key);save();render()}
function action(a){if(a==='closeModal'){ui.modal=null;render()}else if(a==='closePalette'){ui.palette=false;render()}else if(a==='palette'){ui.palette=true;ui.search='';render()}else if(a==='newProject'){ui.modal={type:'project'};render()}else if(a==='newShot'){if(!project())return toast('Önce proje oluştur.');ui.modal={type:'shot'};render()}else if(a==='newEquipment'){ui.modal={type:'equipment'};render()}else if(a==='newDelivery'){if(!project())return toast('Önce proje oluştur.');ui.modal={type:'delivery'};render()}else if(a==='newTimeline'){ui.modal={type:'timeline'};render()}else if(a==='smartShots'){ui.modal={type:'smart'};render()}else if(a==='goShoot')setView('shoot');else if(a==='goShots')setView('shots');else if(a==='goEquipment')setView('equipment');else if(a==='focusNote'){document.getElementById('quickNote')?.focus()}else if(a==='addNote'){const el=document.getElementById('quickNote');const v=el?.value.trim();if(v){data.notes.push({id:uid(),projectId:project().id,body:v,createdAt:iso(),updatedAt:iso()});save();render()}}else if(a==='completeCurrent'){const x=tl().find(x=>x.status==='Devam Ediyor')||tl().find(x=>x.status==='Bekliyor');if(x){x.status='Tamamlandı';const n=tl().find(y=>y.id!==x.id&&y.status==='Bekliyor');if(n)n.status='Devam Ediyor';save();render()}}else if(a==='nextShot'){const s=shots();const i=s.findIndex(x=>x.status==='Çekilecek'||x.status==='Tekrar');if(i>=0){ui.modal={type:'shot',id:s[i].id};render()}else toast('Bekleyen shot kalmadı.')}else if(a==='gearAll'){data.gearLists[project().id]=data.equipment.map(e=>e.id);save();render()}else if(a==='gearClear'){data.gearLists[project().id]=[];data.gearChecks[project().id]=[];save();render()}else if(a==='cloudSaveConfig')saveCloudConfig();else if(a==='cloudSignIn')cloudSignIn();else if(a==='cloudSignUp')cloudSignUp();else if(a==='cloudSignOut')cloudSignOut();else if(a==='cloudSync')syncNow(true);else if(a==='exportData')exportData();else if(a==='importData')document.getElementById('importFile')?.click();else if(a==='resetData'){if(confirm('Tüm yerel veriyi boş başlangıç verisine sıfırlamak istiyor musun?')){data=seed();save();ui.activeProjectId=data.projects[0]?.id||'';render()}}else if(a==='downloadFolderScript')downloadFolderScript();else if(a==='copyProjectName'){const p=project();navigator.clipboard?.writeText(safeName(`${p.client}_${p.name}_${new Date(p.shootDate||Date.now()).getFullYear()}`));toast('Proje adı kopyalandı.')}else if(a==='generateSmartShots')generateSmartShots()}
function saveProject(id){const f=formObj();if(!f.client||!f.name)return toast('Müşteri ve proje adı gerekli.');const x={id:id||uid(),client:f.client,name:f.name,type:f.type,shootDate:f.shootDate,deliveryDate:f.deliveryDate,location:f.location,format:f.format,team:f.team.split(',').map(x=>x.trim()).filter(Boolean),notes:f.notes,status:f.status,nextTask:f.nextTask,updatedAt:iso()};const i=data.projects.findIndex(p=>p.id===id);i>=0?data.projects[i]=x:data.projects.push(x);if(!id){ui.activeProjectId=x.id;data.gearChecks[x.id]=[];data.gearLists[x.id]=[]}save();ui.modal=null;render();toast('Proje kaydedildi.')}
function deleteProject(id){if(!confirm('Bu proje ve bağlı shot/teslim/timeline kayıtları silinsin mi?'))return;data.projects=data.projects.filter(x=>x.id!==id);data.shots=data.shots.filter(x=>x.projectId!==id);data.deliveries=data.deliveries.filter(x=>x.projectId!==id);data.timeline=data.timeline.filter(x=>x.projectId!==id);data.notes=data.notes.filter(x=>x.projectId!==id);delete data.gearChecks[id];delete data.gearLists[id];ui.activeProjectId=data.projects[0]?.id||'';save();ui.modal=null;render()}
function saveShot(id){const f=formObj();const p=project();if(!f.name)return toast('Shot adı gerekli.');const old=data.shots.find(s=>s.id===id);const x={id:id||uid(),projectId:p.id,no:+f.no||1,name:f.name,description:f.description,camera:f.camera,lens:f.lens,fps:+f.fps||25,shutter:f.shutter,framing:f.framing,movement:f.movement,support:f.support,location:f.location,subject:f.subject,estimatedMinutes:+f.estimatedMinutes||0,note:f.note,status:f.status,storyboardImage:old?.storyboardImage||'',updatedAt:iso()};const i=data.shots.findIndex(s=>s.id===id);i>=0?data.shots[i]=x:data.shots.push(x);save();ui.modal=null;render();toast('Shot kaydedildi.')}
function saveEquipment(id){const f=formObj();if(!f.name)return toast('Ekipman adı gerekli.');const x={id:id||uid(),name:f.name,category:f.category,status:f.status,quantity:+f.quantity||1,note:f.note,updatedAt:iso()};const i=data.equipment.findIndex(e=>e.id===id);i>=0?data.equipment[i]=x:data.equipment.push(x);save();ui.modal=null;render()}
function saveDelivery(id){const f=formObj();const x={id:id||uid(),projectId:project().id,version:f.version,date:f.date,time:f.time,fileName:f.fileName,link:f.link,status:f.status,note:f.note,updatedAt:iso()};const i=data.deliveries.findIndex(d=>d.id===id);i>=0?data.deliveries[i]=x:data.deliveries.push(x);save();ui.modal=null;render();toast('Teslim kaydedildi.')}

function exportData(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});download(blob,`rec-backup-${dateISO()}.json`);toast('Yedek indirildi.')}
function importFile(e){const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.projects||!x.shots)throw Error();data=x;migrate();save();ui.activeProjectId=data.projects[0]?.id||'';render();toast('Yedek yüklendi.')}catch{toast('Geçersiz rec. yedeği.')}};r.readAsText(f)}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function downloadFolderScript(){const p=project();const folder=safeName(`${p.client}_${p.name}_${new Date(p.shootDate||Date.now()).getFullYear()}`);const content=`#!/bin/zsh\nset -e\nROOT=\"$HOME/Desktop/${folder}\"\nmkdir -p \"$ROOT\"/{01_FOOTAGE,02_AUDIO,03_MUSIC,04_GFX,05_PHOTO,06_PROJECT,07_EXPORT,08_DELIVERY}\nopen \"$ROOT\"\necho \"rec. proje klasörü oluşturuldu: $ROOT\"\n`;download(new Blob([content],{type:'text/plain'}),`${folder}_CREATE.command`);toast('Klasör oluşturma komutu indirildi. Mac’te gerekirse chmod +x ver.')}
function generateSmartShots(){const f=formObj();const p=project();const brief=(f.brief||'').toLocaleLowerCase('tr-TR');const gear=f.gear||'';let template=[];if(p.type==='Fabrika Filmi'||brief.includes('fabrika'))template=[['Exterior Establishing','14mm','Wide','Slow Push In','Gimbal'],['Üretim Hattı Wide','14mm','Wide','Tracking','Gimbal'],['Makine Detayları','50mm','Detail','Static','Tripod'],['Çalışan Operasyon','24-70mm','Medium','Handheld','Handheld'],['Kalite Kontrol','50mm','Close Up','Slow Slide','Gimbal'],['Ürün / Çıktı Hero','50mm','Close Up','Slow Push In','Tripod']];else if(p.type==='Sağlık'||brief.includes('doktor'))template=[['Doktor Ana Konuşma','50mm','Medium Close Up','Static','Tripod'],['İkinci Kamera Açısı','24-70mm','Medium','Static','Tripod'],['Klinik Establishing','14mm','Wide','Slow Push In','Gimbal'],['Doktor B-Roll','50mm','Close Up','Handheld','Handheld'],['Detay / Ekipman','50mm','Detail','Static','Tripod']];else if(p.type==='Ürün'||brief.includes('ürün'))template=[['Hero Wide','50mm','Medium','Slow Push In','Tripod'],['Texture Detail','50mm','Macro/Detail','Static','Tripod'],['Preparation B-Roll','24-70mm','Close Up','Handheld','Handheld'],['Top Shot','24-70mm','Top Down','Static','Tripod'],['Final Beauty','50mm','Close Up','Slow Orbit','Gimbal']];else template=[['Establishing','14mm','Wide','Slow Push In','Gimbal'],['Ana Aksiyon','24-70mm','Medium','Tracking','Gimbal'],['Detay 01','50mm','Close Up','Static','Tripod'],['Detay 02','50mm','Detail','Handheld','Handheld'],['İnsan / Etkileşim','24-70mm','Medium','Handheld','Handheld'],['Final Hero','50mm','Close Up','Slow Push In','Tripod']];const start=Math.max(0,...data.shots.filter(s=>s.projectId===p.id).map(s=>s.no));template.forEach((t,i)=>data.shots.push({id:uid(),projectId:p.id,no:start+i+1,name:t[0],description:`${p.name} için önerilen shot.`,camera:gear.includes('FX30')?'Sony FX30':'Kamera A',lens:t[1],fps:50,shutter:'1/100',framing:t[2],movement:t[3],support:t[4],location:p.location,subject:'',estimatedMinutes:6,note:'Yerel akıllı oluşturucu tarafından önerildi.',status:'Çekilecek',storyboardImage:'',updatedAt:iso()}));save();ui.modal=null;ui.shotView='card';render();toast(`${template.length} shot oluşturuldu.`)}

async function cloudSetPassword(){
  const pw=document.getElementById('newRecPassword')?.value||'';
  if(pw.length<8)return toast('Parola en az 8 karakter olmalı.');
  try{const ses=await ensureSession();if(!ses)throw new Error('Önce giriş yap.');const r=await fetch(cleanUrl(cloudConfig.url)+'/auth/v1/user',{method:'PUT',headers:{apikey:cloudConfig.key,Authorization:'Bearer '+ses.access_token,'Content-Type':'application/json'},body:JSON.stringify({password:pw})});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.message||'Parola güncellenemedi.');toast('rec. parolan kaydedildi. Mac’te Gmail adresin + bu parola ile giriş yapabilirsin.');document.getElementById('newRecPassword').value=''}catch(e){toast(e.message||'Parola güncellenemedi.')}}
function recGoogleOAuthUrl(){
  const scopes='openid email profile';
  const qp='prompt=select_account';
  return cleanUrl(cloudConfig.url)+'/auth/v1/authorize?provider=google&redirect_to='+encodeURIComponent(location.origin+location.pathname)+'&scopes='+encodeURIComponent(scopes)+'&query_params='+encodeURIComponent(qp);
}
function cloudGoogleSignIn(){v111ForceCloudConfig();location.assign(recGoogleOAuthUrl());}
async function consumeOAuthCallback(){
  if(!location.hash||!location.hash.includes('access_token='))return false;
  try{
    const q=new URLSearchParams(location.hash.slice(1));
    const token=q.get('access_token'),refresh=q.get('refresh_token'),expires=Number(q.get('expires_in')||3600);
    if(!token)return false;
    const r=await fetch(cleanUrl(cloudConfig.url)+'/auth/v1/user',{headers:{apikey:cloudConfig.key,Authorization:'Bearer '+token}});
    const user=await r.json(); if(!r.ok)throw new Error(user.message||'Google oturumu alınamadı.');
    storeSession({access_token:token,refresh_token:refresh,expires_in:expires,expires_at:Math.floor(Date.now()/1000)+expires,user});
    history.replaceState(null,'',location.pathname+location.search);
    cloudState.lastServerUpdated='';persistCloudState();
    setTimeout(()=>syncNow(false),250);
    return true;
  }catch(e){console.error(e);toast(e.message||'Google girişi tamamlanamadı.');return false}
}

function storyboardPlan(brief,p){const lower=brief.toLocaleLowerCase('tr-TR');const person=/doktor|şef|kişi|insan|röportaj|konuşma|sunucu|çalışan/.test(lower);const product=/ürün|kruvasan|yemek|kahve|tabak|pizza|tatlı|ürünü/.test(lower);const factory=/fabrika|üretim|makine|hat/.test(lower);const event=/konser|etkinlik|fuar|sahne|kalabalık/.test(lower);const gear=data.equipment.filter(e=>e.status==='Hazır').map(e=>e.name).join(' ').toLowerCase();const camera=gear.includes('fx30')?'Sony FX30':'Kamera A';let base;if(factory)base=[['Mekân Establishing','Çekim alanını ve ölçeği kuran geniş açılı giriş.','14mm','Wide','Slow Push In','Gimbal'],['Ana Süreç','Üretim hattındaki ana aksiyonu yönü okunacak şekilde takip et.','24-70mm','Medium Wide','Tracking','Gimbal'],['Operasyon Detayı','El, makine ve işlem detayını ritmik yakın planla göster.','50mm','Close Up','Micro Move','Tripod'],['İnsan / Kontrol','Çalışanın operasyon veya kalite kontrol anını yakala.','50mm','Medium Close Up','Slow Slide','Gimbal'],['Doku / Mekanik Detay','Markayı ve üretim kalitesini anlatan seçici netlik detayları.','50mm','Detail','Static','Tripod'],['Final Hero','Ürün veya fabrikanın güçlü final karesi.','24-70mm','Hero Wide','Slow Push In','Gimbal']];else if(person)base=[['Mekân Establishing','Konuşmanın geçtiği ortamı kısa bir geniş planla kur.','24mm','Wide','Slow Push In','Gimbal'],['Ana Konuşma','Ana kişiyi göz hizasında temiz ve güvenli bir kadrajda çek.','50mm','Medium Close Up','Static','Tripod'],['İkinci Açı','Kurguda kesme noktası yaratacak hafif çapraz ikinci açı.','70mm','Close Up','Static','Tripod'],['El / İş Detayı','Konuşmayı destekleyen el, ürün, ekipman veya masa detayı.','50mm','Detail','Micro Move','Tripod'],['Doğal B-Roll','Kişinin ortamla etkileşimini doğal hareket içinde kaydet.','24-70mm','Medium','Handheld','Handheld'],['Final Portre','Videoyu kapatacak sakin ve güçlü final portresi.','50mm','Medium Close Up','Slow Push In','Gimbal']];else if(product)base=[['Ortam / Giriş','Ürünün bulunduğu ortamı kuran kısa bir establishing.','24mm','Wide','Slow Push In','Gimbal'],['Hazırlık Başlangıcı','Hazırlığın ilk adımını eller ve ana malzeme ile göster.','50mm','Close Up','Handheld','Handheld'],['Doku Detayı','Malzemenin doku, parlaklık ve tazeliğini çok yakın planda göster.','50mm','Detail','Micro Move','Tripod'],['Ana Aksiyon','Kesme, dökme, sıkma veya servis hareketini takip et.','24-70mm','Medium Close Up','Tracking','Gimbal'],['Servis / Reveal','Ürünün tamamlandığı anı kontrollü bir reveal hareketiyle göster.','50mm','Close Up','Slide / Reveal','Gimbal'],['Final Hero','Ürünü temiz arka plan ve premium ışıkla final hero olarak çek.','50mm','Hero Close Up','Slow Orbit','Gimbal']];else if(event)base=[['Mekân Establishing','Mekân, sahne veya fuar alanının ölçeğini kur.','14mm','Ultra Wide','Slow Push In','Gimbal'],['Kalabalık / Atmosfer','İnsan akışını ve enerjiyi geniş-orta planda takip et.','24-70mm','Wide / Medium','Tracking','Gimbal'],['Ana Aksiyon','Sahnedeki veya standdaki temel aksiyonu net biçimde yakala.','70mm','Medium','Pan / Track','Monopod'],['Detaylar','Işıklar, eller, branding ve reaksiyonlardan ritmik detaylar al.','50mm','Close Up','Handheld','Handheld'],['Reaction','İzleyici veya katılımcı tepkisini kısa doğal anlarla kaydet.','70-200mm','Close Up','Static','Monopod'],['Final Atmosfer','Enerjiyi özetleyen geniş final veya çıkış karesi.','24mm','Wide','Pull Out','Gimbal']];else base=[['Establishing','Mekânı ve sahneyi kuran geniş giriş karesi.','24mm','Wide','Slow Push In','Gimbal'],['Ana Aksiyon','Videonun ana hikâyesini taşıyan temel hareket.','24-70mm','Medium','Tracking','Gimbal'],['Yakın Plan','Ana özneyi daha güçlü gösterecek yakın plan.','50mm','Close Up','Static','Tripod'],['Detay','Hikâyeyi destekleyen küçük detay ve dokular.','50mm','Detail','Micro Move','Tripod'],['Alternatif Açı','Kurguda ritim yaratacak farklı yükseklik/açı.','24-70mm','Medium','Handheld','Handheld'],['Final Hero','Hikâyeyi kapatan temiz final karesi.','50mm','Hero','Slow Push In','Gimbal']];const sentences=brief.replace(/[.!?]\s+/g,'\n').split(/\n|\bsonra\b|\bardından\b/i).map(x=>x.trim()).filter(x=>x.length>12);return base.map((x,i)=>({name:x[0],description:sentences[i]||x[1],camera,lens:x[2],framing:x[3],movement:x[4],support:x[5],fps:/slow|yavaş|slow motion|50 fps|50fps/i.test(brief)?50:(i===2||i===3?50:25),shutter:/slow|yavaş|50 fps|50fps/i.test(brief)?'1/100':'1/50',estimatedMinutes:i===0||i===5?5:7,subject:product?'Ürün':person?'Kişi':factory?'Üretim':event?'Etkinlik':'Ana özne'}))}
function hashNum(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function sketchSvg(step,index,brief){const h=hashNum(brief+step.name+index),sx=260+(h%150),sy=145+((h>>4)%70),close=/close|detail|hero/i.test(step.framing),wide=/wide/i.test(step.framing);const person=/kişi|doktor|şef|insan|çalışan|röportaj/i.test(step.subject+' '+brief);const product=/ürün|kruvasan|yemek|kahve|tabak|pizza|tatlı/i.test(step.subject+' '+brief);let subject='';if(person){const r=close?58:32;subject=`<circle cx="${sx}" cy="${sy-38}" r="${r}"/><path d="M${sx-r*.9} ${sy+r*.3} Q${sx} ${sy} ${sx+r*.9} ${sy+r*.3} L${sx+r*1.2} ${sy+r*2.1} L${sx-r*1.2} ${sy+r*2.1} Z"/>`}else if(product){const w=close?230:150,hh=close?90:60;subject=`<ellipse cx="${sx}" cy="${sy+32}" rx="${w*.65}" ry="${hh*.55}"/><path d="M${sx-w/2} ${sy+18} Q${sx} ${sy-35} ${sx+w/2} ${sy+18} Q${sx} ${sy+65} ${sx-w/2} ${sy+18}Z"/><path d="M${sx-w*.25} ${sy+10} Q${sx} ${sy-10} ${sx+w*.25} ${sy+10}"/>`}else{const w=wide?300:190,hh=wide?150:110;subject=`<rect x="${sx-w/2}" y="${sy-hh/2}" width="${w}" height="${hh}" rx="8"/><path d="M${sx-w/2} ${sy+hh/2} L${sx} ${sy-hh*.1} L${sx+w/2} ${sy+hh/2}"/><circle cx="${sx+w*.2}" cy="${sy-hh*.15}" r="18"/>`};const move=/push/i.test(step.movement)?`<path class="arrow" d="M80 325 L250 245"/><path class="arrow" d="M250 245 l-23 3 M250 245 l-8 22"/>`:/track|slide|pan/i.test(step.movement)?`<path class="arrow" d="M95 320 C220 280 410 280 555 315"/><path class="arrow" d="M555 315 l-22 -13 M555 315 l-22 12"/>`:/orbit/i.test(step.movement)?`<path class="arrow" d="M150 300 C95 210 165 130 270 125"/><path class="arrow" d="M270 125 l-18 -12 M270 125 l-18 15"/>`:'';const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360"><defs><filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="${index+3}" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/></filter><filter id="paper"><feTurbulence baseFrequency="0.7" numOctaves="3" seed="9"/><feColorMatrix values="0 0 0 0 0.93 0 0 0 0 0.91 0 0 0 0 0.86 0 0 0 .12 0"/></filter></defs><rect width="640" height="360" fill="#ece7da"/><rect width="640" height="360" filter="url(#paper)" opacity=".45"/><g fill="none" stroke="#252525" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#rough)" opacity=".9"><rect x="16" y="16" width="608" height="328" rx="4"/><path d="M16 275 H624" opacity=".18"/><path d="M214 16 V344 M426 16 V344" opacity=".08"/>${subject}${move}</g><g fill="none" stroke="#555" stroke-width="1.3" opacity=".38"><path d="M20 20 L620 16 M18 342 L624 339"/>${subject}</g><text x="30" y="42" font-family="ui-monospace,monospace" font-size="12" font-weight="700" fill="#222">${String(index+1).padStart(2,'0')} · ${escSvg(step.framing.toUpperCase())} · ${escSvg(step.lens)}</text><text x="30" y="330" font-family="ui-monospace,monospace" font-size="11" fill="#333">${escSvg(step.movement)} / ${escSvg(step.support)}</text></svg>`;return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)}
function escSvg(s){return String(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function generateStoryboard(){const el=document.getElementById('storyBrief');const brief=el?.value.trim()||ui.storyBrief.trim();if(!brief)return toast('Önce çekimi detaylarıyla anlat.');ui.storyBrief=brief;const p=project();const plan=storyboardPlan(brief,p);const start=Math.max(0,...data.shots.filter(s=>s.projectId===p.id).map(s=>s.no));plan.forEach((st,i)=>data.shots.push({id:uid(),projectId:p.id,no:start+i+1,name:st.name,description:st.description,camera:st.camera,lens:st.lens,fps:st.fps,shutter:st.shutter,framing:st.framing,movement:st.movement,support:st.support,location:p.location,subject:st.subject,estimatedMinutes:st.estimatedMinutes,note:'Akıllı storyboard briefinden oluşturuldu.',status:'Çekilecek',storyboardImage:sketchSvg(st,i,brief),updatedAt:iso()}));save();ui.shotView='story';render();toast(`${plan.length} adımlık storyboard oluşturuldu.`)}

function render(){
  if(!cloudConfigured()||!sessionValid()){document.getElementById('app').innerHTML=authScreen();bind();return}
  let body=ui.view==='home'?dashboard():ui.view==='projects'?projectsView():ui.view==='shoot'?shootView():ui.view==='shots'?shotsView():ui.view==='equipment'?equipmentView():ui.view==='deliveries'?deliveriesView():settingsView();document.getElementById('app').innerHTML=shell(body);bind();requestAnimationFrame(()=>document.getElementById('paletteSearch')?.focus())
}

true);else if(a==='exportData')exportData();else if(a==='importData')document.getElementById('importFile')?.click();else if(a==='resetData'){if(confirm('Tüm yerel veriyi boş başlangıç verisine sıfırlamak istiyor musun?')){data=seed();save();ui.activeProjectId=data.projects[0]?.id||'';render()}}else if(a==='downloadFolderScript')downloadFolderScript();else if(a==='copyProjectName'){const p=project();navigator.clipboard?.writeText(safeName(`${p.client}_${p.name}_${new Date(p.shootDate||Date.now()).getFullYear()}`));toast('Proje adı kopyalandı.')}else if(a==='generateSmartShots')generateSmartShots();else if(a==='generateStoryboard')generateStoryboard()}

function saveProject(id){
  const f=formObj();if(!f.client||!f.name)return toast('Müşteri ve proje adı gerekli.');
  const old=data.projects.find(p=>p.id===id);
  const x={id:id||uid(),client:f.client,name:f.name,type:f.type,shootDate:f.shootDate,deliveryDate:f.deliveryDate,location:f.location,format:f.format,team:f.team.split(',').map(x=>x.trim()).filter(Boolean),notes:f.notes,status:f.status,nextTask:f.nextTask,completedAt:f.status==='Tamamlandı'?(old?.completedAt||iso()):'',archivedAt:old?.archivedAt||'',updatedAt:iso()};
  const i=data.projects.findIndex(p=>p.id===id);i>=0?data.projects[i]=x:data.projects.push(x);
  if(!id){ui.activeProjectId=x.id;data.gearChecks[x.id]=[];data.gearLists[x.id]=[]}
  save();ui.modal=null;render();toast('Proje kaydedildi.')
}
function saveTimeline(id){
  const f=formObj();if(!f.title)return toast('Görev adı gerekli.');
  const x={id:id||uid(),projectId:project().id,time:f.time,title:f.title,status:f.status,sortOrder:+f.sortOrder||1,note:f.note||'',updatedAt:iso()};
  const i=data.timeline.findIndex(t=>t.id===id);i>=0?data.timeline[i]=x:data.timeline.push(x);save();ui.modal=null;render();toast(id?'Görev güncellendi.':'Görev eklendi.')
}

function addTrashItem(type,label,payload){
  const item={trashId:uid(),type,label,deletedAt:iso(),payload};data.trash.unshift(item);return item
}
function deleteProject(id){
  const p=data.projects.find(x=>x.id===id);if(!p)return;
  const payload={project:{...p},shots:data.shots.filter(x=>x.projectId===id),deliveries:data.deliveries.filter(x=>x.projectId===id),timeline:data.timeline.filter(x=>x.projectId===id),notes:data.notes.filter(x=>x.projectId===id),gearChecks:[...(data.gearChecks[id]||[])],gearList:[...(data.gearLists[id]||[])]};
  addTrashItem('project',`${p.client} — ${p.name}`,payload);
  data.projects=data.projects.filter(x=>x.id!==id);data.shots=data.shots.filter(x=>x.projectId!==id);data.deliveries=data.deliveries.filter(x=>x.projectId!==id);data.timeline=data.timeline.filter(x=>x.projectId!==id);data.notes=data.notes.filter(x=>x.projectId!==id);delete data.gearChecks[id];delete data.gearLists[id];
  if(ui.activeProjectId===id)pickNextActiveProject();save();ui.modal=null;ui.projectTab='trash';ui.view='projects';render();toast('Proje çöp kutusuna taşındı.')
}
function delEntity(k,id){
  const entity=(data[k]||[]).find(x=>x.id===id);if(!entity)return;
  const labels={shots:`Shot ${String(entity.no||'').padStart(3,'0')} — ${entity.name||''}`,equipment:entity.name||'Ekipman',deliveries:`${entity.version||'Teslim'} — ${entity.fileName||''}`,timeline:entity.title||'Görev',notes:(entity.body||'Not').slice(0,60)};
  let payload={entity:{...entity}};
  if(k==='equipment'){
    payload.gearLists={};payload.gearChecks={};
    for(const pid in data.gearLists){if((data.gearLists[pid]||[]).includes(id))payload.gearLists[pid]=true;data.gearLists[pid]=(data.gearLists[pid]||[]).filter(x=>x!==id)}
    for(const pid in data.gearChecks){if((data.gearChecks[pid]||[]).includes('gear:'+id))payload.gearChecks[pid]=true;data.gearChecks[pid]=(data.gearChecks[pid]||[]).filter(x=>x!=='gear:'+id)}
  }
  addTrashItem(k,labels[k]||'Silinen kayıt',payload);data[k]=data[k].filter(x=>x.id!==id);save();ui.modal=null;render();toast('Kayıt çöp kutusuna taşındı.')
}
function restoreTrash(id){
  const t=data.trash.find(x=>x.trashId===id);if(!t)return;
  if(t.type==='project'){
    const b=t.payload,p=b.project;if(data.projects.some(x=>x.id===p.id))return toast('Bu proje zaten mevcut.');
    data.projects.push(p);data.shots.push(...(b.shots||[]));data.deliveries.push(...(b.deliveries||[]));data.timeline.push(...(b.timeline||[]));data.notes.push(...(b.notes||[]));data.gearChecks[p.id]=b.gearChecks||[];data.gearLists[p.id]=b.gearList||[];ui.activeProjectId=p.id;ui.projectTab=p.archivedAt?'archive':p.status==='Tamamlandı'?'completed':'active';ui.view='projects';
  }else{
    const k=t.type,e=t.payload?.entity;if(!e)return;
    if(e.projectId&&!data.projects.some(p=>p.id===e.projectId))return toast('Önce bağlı projeyi geri yüklemelisin.');
    if(!data[k].some(x=>x.id===e.id))data[k].push(e);
    if(k==='equipment'){
      for(const pid in (t.payload.gearLists||{})){data.gearLists[pid]=data.gearLists[pid]||[];if(!data.gearLists[pid].includes(e.id))data.gearLists[pid].push(e.id)}
      for(const pid in (t.payload.gearChecks||{})){data.gearChecks[pid]=data.gearChecks[pid]||[];if(!data.gearChecks[pid].includes('gear:'+e.id))data.gearChecks[pid].push('gear:'+e.id)}
    }
  }
  data.trash=data.trash.filter(x=>x.trashId!==id);save();render();toast('Kayıt geri yüklendi.')
}
function permanentTrash(id){data.trash=data.trash.filter(x=>x.trashId!==id);save();ui.modal=null;render();toast('Kayıt kalıcı olarak silindi.')}

function action(a){
  if(a==='closeModal'){ui.modal=null;render()}
  else if(a==='closePalette'){ui.palette=false;render()}
  else if(a==='palette'){ui.palette=true;ui.search='';render()}
  else if(a==='newProject'){ui.modal={type:'project'};render()}
  else if(a==='newShot'){if(!project())return toast('Önce proje oluştur.');ui.modal={type:'shot'};render()}
  else if(a==='newEquipment'){ui.modal={type:'equipment'};render()}
  else if(a==='newDelivery'){if(!project())return toast('Önce proje oluştur.');ui.modal={type:'delivery'};render()}
  else if(a==='newTimeline'){if(!project())return toast('Önce proje oluştur.');ui.modal={type:'timeline'};render()}
  else if(a==='smartShots'){ui.modal={type:'smart'};render()}
  else if(a==='goShoot')setView('shoot')
  else if(a==='goShots')setView('shots')
  else if(a==='goEquipment')setView('equipment')
  else if(a==='openTrash'){ui.view='projects';ui.projectTab='trash';ui.modal=null;render()}
  else if(a==='completeCurrent'){const x=tl().find(x=>x.status==='Devam Ediyor')||tl().find(x=>x.status==='Bekliyor');if(x){x.status='Tamamlandı';x.updatedAt=iso();const n=tl().find(y=>y.id!==x.id&&y.status==='Bekliyor');if(n){n.status='Devam Ediyor';n.updatedAt=iso()}save();render()}}
  else if(a==='nextShot'){const ss=shots();const i=ss.findIndex(x=>x.status==='Çekilecek'||x.status==='Tekrar');if(i>=0){ui.modal={type:'shot',id:ss[i].id};render()}else toast('Bekleyen shot kalmadı.')}
  else if(a==='gearAll'){data.gearLists[project().id]=data.equipment.map(e=>e.id);save();render()}
  else if(a==='gearClear'){data.gearLists[project().id]=[];data.gearChecks[project().id]=[];save();render()}
  else if(a==='cloudSaveConfig')saveCloudConfig()
  else if(a==='cloudSignIn')cloudSignIn()
  else if(a==='cloudSignUp')cloudSignUp()
  else if(a==='cloudGoogleSignIn')cloudGoogleSignIn()
  else if(a==='cloudSetPassword')cloudSetPassword()
  else if(a==='cloudSignOut')cloudSignOut()
  else if(a==='cloudSync')syncNow(true)
  else if(a==='exportData')exportData()
  else if(a==='importData')document.getElementById('importFile')?.click()
  else if(a==='resetData'){ui.modal={type:'resetConfirm'};render()}
  else if(a==='generateSmartShots')generateSmartShots()
  else if(a==='generateStoryboard')generateStoryboard()
}

const EDIT_STATES=['Kurgu Bekliyor','Kurguda','Revize İstendi','Hazır','Onaylandı'];
function ensureV140(){
  ensureV130();
  ui.editQueueTab=ui.editQueueTab||'active';ui.contextMenu=ui.contextMenu||null;
  const map={Bekliyor:'Kurgu Bekliyor','Devam Ediyor':'Kurguda',Tamamlandı:'Hazır'};
  data.timeline=(data.timeline||[]).map((t,i)=>({...t,status:EDIT_STATES.includes(t.status)?t.status:(map[t.status]||'Kurgu Bekliyor'),sortOrder:+t.sortOrder||i+1,archivedAt:t.archivedAt||'',note:t.note||'',time:t.time||''}));
}
ensureV140();
function editItems(pid=project()?.id,includeArchived=false){return (data.timeline||[]).filter(x=>x.projectId===pid&&(includeArchived||!x.archivedAt)).sort((a,b)=>(+a.sortOrder||0)-(+b.sortOrder||0)||String(a.updatedAt||'').localeCompare(String(b.updatedAt||'')))}
function archivedEditItems(pid=project()?.id){return (data.timeline||[]).filter(x=>x.projectId===pid&&x.archivedAt).sort((a,b)=>(+a.sortOrder||0)-(+b.sortOrder||0))}
function normalizeEditOrder(pid){editItems(pid,true).sort((a,b)=>(+a.sortOrder||0)-(+b.sortOrder||0)).forEach((x,i)=>x.sortOrder=i+1)}
function addEditItem(pid,title){title=String(title||'').trim();if(!title)return toast('Video adı gerekli.');const all=editItems(pid,true);data.timeline.push({id:uid(),projectId:pid,time:'',title,status:'Kurgu Bekliyor',sortOrder:all.length+1,note:'',archivedAt:'',updatedAt:iso()});save();toast('Video kurgu sırasına eklendi.')}
function setEditStatus(id,status){const x=data.timeline.find(t=>t.id===id);if(!x||!EDIT_STATES.includes(status))return;x.status=status;x.updatedAt=iso();save();render()}
function moveEditItem(id,dir){const x=data.timeline.find(t=>t.id===id);if(!x)return;const list=editItems(x.projectId);const i=list.findIndex(y=>y.id===id),j=i+dir;if(i<0||j<0||j>=list.length)return;const a=list[i].sortOrder,b=list[j].sortOrder;list[i].sortOrder=b;list[j].sortOrder=a;list[i].updatedAt=list[j].updatedAt=iso();save();render()}
function toggleEditArchive(id){const x=data.timeline.find(t=>t.id===id);if(!x)return;x.archivedAt=x.archivedAt?'':iso();x.updatedAt=iso();save();ui.contextMenu=null;render();toast(x.archivedAt?'Video arşive taşındı.':'Video kurgu sırasına geri alındı.')}
function editStatusSummary(pid){const list=editItems(pid);return EDIT_STATES.map(st=>{const n=list.filter(x=>x.status===st).length;return n?`<span class="pill">${esc(st)} · ${n}</span>`:''}).join('')}
function editQueueRows(pid,archived=false){const list=archived?archivedEditItems(pid):editItems(pid);return list.map((x,i)=>`<div class="edit-item" data-edit-item="${x.id}" data-context-edit="${x.id}"><div class="edit-order">${String(i+1).padStart(2,'0')}</div><div class="edit-main"><b>${esc(x.title)}</b><small>${x.note?esc(x.note):archived?'Arşivde':'Not eklemek için Aç’a tıkla'}</small></div><select class="edit-status" data-edit-status="${x.id}" data-state="${esc(x.status)}" ${archived?'disabled':''}>${EDIT_STATES.map(st=>`<option ${x.status===st?'selected':''}>${st}</option>`).join('')}</select><div class="edit-row-actions">${!archived?`<button class="btn small ghost" data-move-edit="${x.id}" data-dir="-1" title="Yukarı taşı">↑</button><button class="btn small ghost" data-move-edit="${x.id}" data-dir="1" title="Aşağı taşı">↓</button>`:''}<button class="btn small" data-open-edit="${x.id}">Aç</button></div></div>`).join('')||`<div class="empty">${archived?'Arşivde video yok.':'Kurgu sırası boş. Yukarıdaki alana video adını yazıp Enter’a bas.'}</div>`}

function shell(body){
  const desktopNav=[['home','Ana Sayfa'],['projects','Projeler'],['shoot','Kurgu'],['shots','Shot List'],['equipment','Ekipman'],['deliveries','Teslimler']];

function dashboard(){
  const today=dateISO();const active=activeProjects();const edits=(data.timeline||[]).filter(x=>!x.archivedAt&&active.some(p=>p.id===x.projectId));
  const waiting=edits.filter(x=>x.status==='Kurgu Bekliyor');const revisions=edits.filter(x=>x.status==='Revize İstendi');const approved=edits.filter(x=>x.status==='Onaylandı');
  const in7=active.filter(p=>p.shootDate>=today&&p.shootDate<=future(7)).sort((a,b)=>a.shootDate.localeCompare(b.shootDate));
  const due2=active.filter(p=>p.deliveryDate>=today&&p.deliveryDate<=future(2)).sort((a,b)=>a.deliveryDate.localeCompare(b.deliveryDate));
  const day=new Intl.DateTimeFormat('tr-TR',{day:'numeric',month:'long',year:'numeric',weekday:'long'}).format(new Date());
  const revRows=revisions.slice(0,6).map(x=>{const p=projectById(x.projectId);return `<div class="ops-row"><div><b>${esc(x.title)}</b><small>${esc(p?.client||'')} — ${esc(p?.name||'')}</small></div><button class="btn small" data-open-edit-global="${x.id}">Aç</button></div>`}).join('')||'<div class="empty">Revize bekleyen video yok.</div>';
  const queue=waiting.slice(0,6).map(x=>{const p=projectById(x.projectId);return `<div class="ops-row"><div><b>${esc(x.title)}</b><small>${esc(p?.client||'')} — ${esc(p?.name||'')}</small></div><span class="pill">Kurgu Bekliyor</span></div>`}).join('')||'<div class="empty">Kurgu bekleyen video yok.</div>';
  return `<div class="hero"><div class="eyebrow">${esc(day.toLocaleUpperCase('tr-TR'))}</div><h1>Günaydın ${esc(data.settings.name||'Kullanıcı')}</h1><p>Bugün neyin çekileceği, kurgulanacağı ve teslim edileceği tek bakışta.</p></div><div class="ops-grid"><div class="ops-card" data-ops="waiting"><div class="eyebrow">KURGU BEKLİYOR</div><b>${waiting.length}</b><p>Sıraya alınmış video</p></div><div class="ops-card alert" data-ops="revision"><div class="eyebrow">REVİZE</div><b>${revisions.length}</b><p>Müşteri geri bildirimi bekleyen</p></div><div class="ops-card"><div class="eyebrow">7 GÜNDE ÇEKİM</div><b>${in7.length}</b><p>Yaklaşan proje</p></div><div class="ops-card warn" data-ops="due"><div class="eyebrow">2 GÜNDE TESLİM</div><b>${due2.length}</b><p>Öncelikli teslim</p></div></div><div class="grid two"><section class="panel">${sectionTitle('ÖNCELİK','Revize İstenenler')}<div class="ops-list">${revRows}</div></section><section class="panel">${sectionTitle('SIRADAKİ','Kurgu Bekleyenler')}<div class="ops-list">${queue}</div></section></div><div style="height:15px"></div><section class="panel">${sectionTitle('DEVAM EDEN','Projeler',`${btn('Şablondan Oluştur','newFromTemplate','btn')}${btn('+ Yeni Proje','newProject','btn primary')}`)}<div class="project-grid">${active.slice(0,9).map(projectCard).join('')||'<div class="empty">Henüz aktif proje yok.</div>'}</div></section>`

function projectsView(){

workspace-tab-jump="notes">Not Ekle</button>`)}${notes.slice(0,5).map(n=>`<div class="row"><div><b>${esc(n.body)}</b><small>${new Date(n.createdAt).toLocaleString('tr-TR',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}</small></div></div>`).join('')||'<div class="empty">Proje notu yok.</div>'}</section></div>`

function editQueueSection(pid){const list=editItems(pid),arch=archivedEditItems(pid);const queue=ui.editQueueTab==='archive'?editQueueRows(pid,true):editQueueRows(pid,false);const switcher=`<div class="view-switch"><button class="${ui.editView==='queue'?'active':''}" data-edit-view="queue">Sıra</button><button class="${ui.editView==='pipeline'?'active':''}" data-edit-view="pipeline">Pipeline</button></div>`;const quick=`<div class="edit-quick"><input id="editQuickTitle" placeholder="Video adını yaz ve Enter’a bas…"><button class="btn primary" data-act="quickAddEdit">Sıraya Ekle</button></div>`;if(ui.editView==='pipeline')return `${quick}<div class="section-title"><div><div class="eyebrow">KURGU AKIŞI</div><h2>Pipeline</h2></div>${switcher}</div>${pipelineHtml(pid)}`;return `${quick}<div class="section-title"><div><div class="eyebrow">KURGU SIRASI</div><h2>Videolar</h2></div>${switcher}</div><div class="edit-tabs"><button class="${ui.editQueueTab!=='archive'?'active':''}" data-edit-tab="active">Sırada · ${list.length}</button><button class="${ui.editQueueTab==='archive'?'active':''}" data-edit-tab="archive">Arşiv · ${arch.length}</button></div><div class="edit-queue">${queue}</div><div class="queue-help">Sağ tık: düzenle, arşive taşı veya çöp kutusuna taşı. ↑ ↓ ile sıralamayı değiştir.</div>`}

function calendarICS(events=allCalendarEvents()){
  const clean=s=>String(s||'').replace(/\\/g,' ').replace(/[,;]/g,' ').replace(/\n/g,' ');
  const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
  const rows=events.map(ev=>{let ds,de;if(ev.startTime){ds=ev.date.replaceAll('-','')+'T'+ev.startTime.replace(':','')+'00';de=ev.date.replaceAll('-','')+'T'+(ev.endTime||ev.startTime).replace(':','')+'00';return `BEGIN:VEVENT\r\nUID:${clean(ev.eventKey)}@rec.local\r\nDTSTAMP:${stamp}\r\nDTSTART:${ds}\r\nDTEND:${de}\r\nSUMMARY:${clean(ev.title)}\r\nLOCATION:${clean(ev.location)}\r\nDESCRIPTION:${clean([ev.label,ev.notes].filter(Boolean).join(' · '))}\r\nEND:VEVENT`};ds=ev.date.replaceAll('-','');de=datePlus(ev.date,1).replaceAll('-','');return `BEGIN:VEVENT\r\nUID:${clean(ev.eventKey)}@rec.local\r\nDTSTAMP:${stamp}\r\nDTSTART;VALUE=DATE:${ds}\r\nDTEND;VALUE=DATE:${de}\r\nSUMMARY:${clean(ev.title)}\r\nLOCATION:${clean(ev.location)}\r\nDESCRIPTION:${clean([ev.label,ev.notes].filter(Boolean).join(' · '))}\r\nEND:VEVENT`}).join('\r\n');
  return `BEGIN:VCALENDAR\r\nVERSION:2.0\r\nCALSCALE:GREGORIAN\r\nPRODID:-//rec.//Production Workspace//TR\r\n${rows}\r\nEND:VCALENDAR\r\n`;
}
function exportCalendarICS(){download(new Blob([calendarICS()],{type:'text/calendar'}),'rec-calendar.ics');toast('Takvim .ics dosyası hazırlandı.')}

function calendarView(){

  const dayEvents=calendarEventsOn(selected);const agenda=dayEvents.map(ev=>`<div class="agenda-event"><header><div><b>${esc(ev.title)}</b><small>${esc(ev.label||ev.kind)}${ev.startTime?` · ${esc(ev.startTime)}${ev.endTime?'–'+esc(ev.endTime):''}`:''}${ev.location?` · ${esc(ev.location)}`:''}</small></div><span class="agenda-dot ${ev.kind==='shoot'?'shoot':ev.kind==='delivery'?'delivery':'custom'}"></span></header><div class="agenda-actions">${ev.source==='project'?`<button class="btn small" data-calendar-open-project="${ev.projectId}">Projeyi Aç</button>`:`<button class="btn small" data-calendar-edit="${ev.id}">Düzenle</button>`}<button class="btn small" data-google-calendar="${esc(ev.eventKey)}"><span class="google-g">G</span> Calendar</button></div></div>`).join('')||'<div class="calendar-empty">Bu günde etkinlik yok.</div>';

function wsFriendlyError(e){

function mergeEntityArrays(localArr=[],remoteArr=[]){

  return [...out.values()];
}

    else if(a&&b&&typeof a==='object'&&typeof b==='object'&&!Array.isArray(a)&&!Array.isArray(b))out[k]={...b,...a};

}
